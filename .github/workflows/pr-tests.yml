# Проверка перед слиянием в main: сборка и все тесты.
# Правило защиты ветки main требует, чтобы эта проверка («tests») прошла, иначе кнопка Merge недоступна.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build worker/dist/worker.js
        run: python3 worker/build.py
      - name: Tests
        run: node worker/test/run.mjs
