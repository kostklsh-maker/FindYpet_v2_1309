
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Finder — Help Sam Get Home</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; margin: 0; }
    .card { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); max-width: 380px; margin: 40px auto 0; }
    .badge { background: #ffe3e3; color: #d6336c; font-weight: bold; padding: 6px 12px; border-radius: 20px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 12px; }
    h1 { color: #1c1e21; margin: 0 0 10px; font-size: 26px; }
    p.description { font-size: 16px; color: #606770; line-height: 1.5; margin-bottom: 25px; }
    .btn-call { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; background: #2b8a3e; color: white; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 12px; box-shadow: 0 4px 12px rgba(43, 138, 62, 0.3); transition: transform 0.1s; }
    .btn-call:active { transform: scale(0.98); }
    .status { margin-top: 20px; font-size: 13px; color: #868e96; }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">Lost Pet</div>
  <h1 id="petName">My name is Sam</h1>
  <p class="description" id="petText">I'm lost! Please help me get back to my owner.</p>
  
  <!-- Кнопка вызова -->
  <a id="callBtn" href="tel:+123456789" class="btn-call">
    <span>📞</span> Call Owner
  </a>
  
  <div id="statusMsg" class="status">Sharing location with owner...</div>
</div>

<script>
  // ЗАМЕНИТЕ НА ВАШ АКТУАЛЬНЫЙ URL ИЗ GOOGLE APPS SCRIPT ИЛИ CLOUDFLARE PROXY
  const BACKEND_URL = 'https://findypet-app.kostikklsh.workers.dev'; 
  
  const urlParams = new URLSearchParams(window.location.search);
  const idTag = urlParams.get('id') || '1'; // По умолчанию id=1

  // 1. Попытка загрузить динамические данные из вашей базы
  fetch(`${BACKEND_URL}?action=getTag&id=${idTag}`)
    .then(res => res.json())
    .then(data => {
      if (data && data.found) {
        if (data.pet_name) {
          document.getElementById('petName').innerText = `My name is ${data.pet_name}`;
        }
        if (data.phone) {
          document.getElementById('callBtn').href = `tel:${data.phone}`;
        }
      }
    })
    .catch(err => {
      console.log('Using default text due to network or CORS fallback.');
    });

  // 2. Отправка геолокации в Telegram хозяину
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'reportFound',
            id_tag: idTag,
            lat: position.coords.latitude,
            lon: position.coords.longitude
          })
        })
        .then(res => res.json())
        .then(data => {
          document.getElementById('statusMsg').innerText = '✅ Location sent to owner!';
        })
        .catch(() => {
          document.getElementById('statusMsg').innerText = 'Location service active.';
        });
      },
      (error) => {
        document.getElementById('statusMsg').innerText = 'Location access denied.';
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
</script>

</body>
</html>
