# Выкладка Worker'а. Запускается автоматически из GitHub Actions (.github/workflows/deploy-worker.yml)
# после сборки: python3 worker/build.py
#
#   ветка main  → рабочий сайт   findy-pet.com       (Worker findypet-app)          wrangler deploy
#   ветка test  → тестовый сайт  test.findy-pet.com  (Worker findypet-app-staging)  wrangler deploy --env staging
name = "findypet-app"
main = "dist/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Не трогать переменные, заданные в панели Cloudflare (BOT_USERNAME, TIMEZONE, LOST_CHANNEL_ID…);
# SITE_URL задаётся ниже, в [vars]. Действует для обоих сайтов.
# Секреты (BOT_TOKEN, GAS_URL, GAS_KEY, WEBHOOK_SECRET, ADMIN_CHAT_ID, TWILIO_*) выкладка тоже не меняет.
keep_vars = true

# ============================================================
# РАБОЧИЙ САЙТ — findy-pet.com
# ============================================================
# Свой домен: Cloudflare сам создаёт DNS-записи и сертификат. workers.dev тоже продолжает работать,
# поэтому старые ссылки (уже записанные жетоны, вебхук бота) не ломаются.
routes = [
  { pattern = "findy-pet.com", custom_domain = true },
  { pattern = "www.findy-pet.com", custom_domain = true },
]

[vars]
SITE_URL = "https://findy-pet.com"   # от этого адреса строятся ссылки на страницы, QR и NFC

[[kv_namespaces]]
binding = "FYP_KV"
id = "d0564acb6cc546f5b82f0a8f6b78508b"   # findypet-data

[triggers]
crons = ["0 7 * * *"]                     # ежедневно 10:00 по Израилю — напоминания раз в 180 дней

# Лимиты частоты запросов (Workers Rate Limiting). Считаются в каждом дата-центре отдельно.
# Если бинды не подключились, сайт работает без лимитов (см. limited() в worker.js).
[[unsafe.bindings]]   # страница жетона и события воронки — на один адрес посетителя: 30 в минуту
name = "RL_READ"
type = "ratelimit"
namespace_id = "7101"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]   # скан, геолокация, «питомец найден» — на один адрес: 10 в минуту
name = "RL_SIGNAL"
type = "ratelimit"
namespace_id = "7102"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]   # заказы с сайта — на один адрес: 5 в минуту
name = "RL_ORDER"
type = "ratelimit"
namespace_id = "7103"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]   # оповещения владельцу — на один жетон, с любых адресов: 3 в минуту
name = "RL_TAG"
type = "ratelimit"
namespace_id = "7104"
simple = { limit = 3, period = 60 }

# ============================================================
# ТЕСТОВЫЙ САЙТ — test.findy-pet.com (Worker findypet-app-staging)
# ============================================================
# Полная копия сайта для проверки изменений перед публикацией. Со своим хранилищем:
# тестовые заказы не попадают ни в Google-таблицу, ни в данные рабочего сайта.
# routes и triggers наследуются от рабочего сайта, поэтому заданы здесь явно —
# иначе тестовая копия заняла бы findy-pet.com и рассылала напоминания.
[env.staging]
workers_dev = true
routes = [
  { pattern = "test.findy-pet.com", custom_domain = true },
]

[env.staging.vars]
SITE_URL = "https://test.findy-pet.com"
STAGE = "test"      # пометка «ТЕСТ» на страницах, запрет индексации, без напоминаний
TEST_DB = "1"       # жетоны — в хранилище тестового сайта (номера с 9001), а не в Google-таблице
TIMEZONE = "Asia/Jerusalem"

[[env.staging.kv_namespaces]]
binding = "FYP_KV"
id = "a83f6204d6344c058652beff71017527"   # findypet-data-test

[env.staging.triggers]
crons = []

# Тестовый сайт — свои счётчики (другие namespace_id), чтобы проверки не тратили лимиты рабочего.
[[env.staging.unsafe.bindings]]   # страница жетона и события воронки — на один адрес посетителя: 30 в минуту
name = "RL_READ"
type = "ratelimit"
namespace_id = "7201"
simple = { limit = 30, period = 60 }

[[env.staging.unsafe.bindings]]   # скан, геолокация, «питомец найден» — на один адрес: 10 в минуту
name = "RL_SIGNAL"
type = "ratelimit"
namespace_id = "7202"
simple = { limit = 10, period = 60 }

[[env.staging.unsafe.bindings]]   # заказы с сайта — на один адрес: 5 в минуту
name = "RL_ORDER"
type = "ratelimit"
namespace_id = "7203"
simple = { limit = 5, period = 60 }

[[env.staging.unsafe.bindings]]   # оповещения владельцу — на один жетон, с любых адресов: 3 в минуту
name = "RL_TAG"
type = "ratelimit"
namespace_id = "7204"
simple = { limit = 3, period = 60 }
